global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'website'
    metrics_path: /probe
    params:
      module: [http_2xx] 
    file_sd_configs:
      - files:
        - 'targets/*.yml'
        - 'targets/*.json'
        refresh_interval: 2m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # OPTIONAL: AWS EC2 Auto-Discovery
  # This will automatically find any EC2 instance with the tag 'monitor: true'
  # - job_name: 'aws-ec2-discovery'
  #   ec2_sd_configs:
  #     - region: us-east-1 # Change to your region
  #       port: 9100        # Assumes node-exporter is on 9100
  #   relabel_configs:
  #     - source_labels: [__meta_ec2_tag_monitor]
  #       regex: 'true'
  #       action: keep
  #     - source_labels: [__meta_ec2_private_ip]
  #       target_label: instance
