version: '3.7'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./templates/:/etc/alertmanager/template/
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
      
  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    environment:
      - DISCORD_WEBHOOK=https://discord.com/api/webhooks/1362327885741953115/Iu6WNZaobx468Bub2StlFXNrHozG9P6coL1Mi5zeHYxVibHKDn73Qh_QlqpsmGtWNE5s
    ports:
      - "9094:9094"