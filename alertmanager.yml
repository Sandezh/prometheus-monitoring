global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 0s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'discord'

receivers:
- name: 'discord'
  webhook_configs:
  - url: 'http://alertmanager-discord:9094'
    send_resolved: true

templates:
- '/etc/alertmanager/template/*.tmpl'