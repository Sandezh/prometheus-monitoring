global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'multi-channel'

receivers:
- name: 'multi-channel'
  webhook_configs:
    - url: 'http://alertmanager-discord:9094'
      send_resolved: true
  slack_configs:
    - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
      channel: '#monitoring'
      send_resolved: true

- name: 'discord'
  webhook_configs:
  - url: 'http://alertmanager-discord:9094'
    send_resolved: true

templates:
- '/etc/alertmanager/template/*.tmpl'